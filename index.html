<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>YFT Stock Scanner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000);
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    padding: 12px 16px;
    background: var(--tg-theme-secondary-bg-color, #f0f0f0);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .counts { font-size: 13px; color: var(--tg-theme-hint-color, #666); }
  #scanner-wrap {
    position: relative;
    background: #000;
    aspect-ratio: 1 / 1;
    max-height: 45vh;
    width: 100%;
  }
  #reader { width: 100% !important; height: 100% !important; }
  #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
  .scan-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 70%; height: 30%;
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 12px;
    pointer-events: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.3);
  }
  .toast {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; }
  .toast.success { background: rgba(34, 139, 34, 0.9); }
  .toast.dup { background: rgba(0, 100, 200, 0.9); }
  #list-section {
    padding: 8px 12px 100px;
  }
  .list-header {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    font-size: 13px;
    color: var(--tg-theme-hint-color, #666);
  }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--tg-theme-hint-color, #999);
    font-size: 14px;
  }
  .row {
    display: flex;
    align-items: center;
    background: var(--tg-theme-secondary-bg-color, #f5f5f5);
    margin-bottom: 6px;
    padding: 10px 12px;
    border-radius: 8px;
    gap: 10px;
    animation: slideIn 0.2s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .row.just-updated {
    animation: flash 0.4s;
  }
  @keyframes flash {
    0% { background: #ffeb3b; }
    100% { background: var(--tg-theme-secondary-bg-color, #f5f5f5); }
  }
  .row .code {
    flex: 1;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 13px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .qty-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row .qty-btn {
    width: 32px;
    height: 32px;
    border-radius: 16px;
    border: none;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .row .qty-btn.minus { background: #888; }
  .row .qty {
    min-width: 32px;
    text-align: center;
    font-weight: 600;
    font-size: 15px;
  }
  .row .del {
    background: none;
    border: none;
    color: #e53935;
    padding: 4px 8px;
    font-size: 18px;
    cursor: pointer;
  }
  #bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--tg-theme-bg-color, #fff);
    border-top: 1px solid rgba(0,0,0,0.1);
    padding: 10px 12px;
    display: flex;
    gap: 8px;
  }
  #submitBtn {
    flex: 1;
    padding: 14px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #submitBtn:disabled { opacity: 0.5; }
  #clearBtn {
    padding: 14px 18px;
    background: var(--tg-theme-secondary-bg-color, #ddd);
    color: var(--tg-theme-text-color, #000);
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .edit-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .edit-overlay.show { display: flex; }
  .edit-box {
    background: var(--tg-theme-bg-color, #fff);
    padding: 20px;
    border-radius: 12px;
    width: 85%;
    max-width: 320px;
  }
  .edit-box h3 {
    margin: 0 0 12px;
    font-size: 14px;
  }
  .edit-box .edit-code {
    font-family: monospace;
    font-size: 13px;
    color: var(--tg-theme-hint-color, #666);
    margin-bottom: 12px;
    word-break: break-all;
  }
  .edit-box input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid rgba(0,0,0,0.2);
    border-radius: 8px;
    text-align: center;
  }
  .edit-box .buttons {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .edit-box button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .edit-box .save {
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
  }
  .edit-box .cancel {
    background: var(--tg-theme-secondary-bg-color, #ddd);
  }
</style>
</head>
<body>

<header>
  <h1>Stock Scanner</h1>
  <span class="counts" id="counts">0 scans · 0 unique</span>
</header>

<div id="scanner-wrap">
  <div id="reader"></div>
  <div class="scan-overlay"></div>
  <div class="toast" id="toast"></div>
</div>

<div id="list-section">
  <div class="list-header">
    <span>Scanned items</span>
    <span id="totalBadge"></span>
  </div>
  <div id="list"></div>
  <div class="empty-state" id="emptyState">
    Point the camera at a barcode to start.<br>
    Scan the same code again to add qty.
  </div>
</div>

<div id="bottom-bar">
  <button id="clearBtn">Clear</button>
  <button id="submitBtn" disabled>Submit</button>
</div>

<div class="edit-overlay" id="editOverlay">
  <div class="edit-box">
    <h3>Edit quantity</h3>
    <div class="edit-code" id="editCode"></div>
    <input type="number" id="editInput" min="0" inputmode="numeric">
    <div class="buttons">
      <button class="cancel" id="editCancel">Cancel</button>
      <button class="save" id="editSave">Save</button>
    </div>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // ── Running tally: Map<code, qty> ──
  const tally = new Map();
  let lastScan = { code: null, at: 0 };

  function updateCounts() {
    const uniq = tally.size;
    let total = 0;
    tally.forEach(v => total += v);
    document.getElementById('counts').textContent = total + ' scan' + (total !== 1 ? 's' : '') + ' · ' + uniq + ' unique';
    document.getElementById('submitBtn').disabled = uniq === 0;
    document.getElementById('submitBtn').textContent = uniq === 0
      ? 'Submit'
      : 'Submit ' + uniq + ' item' + (uniq !== 1 ? 's' : '');
    document.getElementById('emptyState').style.display = uniq === 0 ? 'block' : 'none';
    document.getElementById('totalBadge').textContent = uniq ? total + ' total' : '';
  }

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    // Show most-recent at top
    const codes = [...tally.keys()].reverse();
    for (const code of codes) {
      const qty = tally.get(code);
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.code = code;
      row.innerHTML =
        '<span class="code">' + code + '</span>' +
        '<div class="qty-controls">' +
          '<button class="qty-btn minus" data-act="minus">−</button>' +
          '<span class="qty" data-act="edit">' + qty + '</span>' +
          '<button class="qty-btn plus" data-act="plus">+</button>' +
        '</div>' +
        '<button class="del" data-act="del">×</button>';
      list.appendChild(row);
    }
    updateCounts();
  }

  function flashRow(code) {
    const row = document.querySelector('.row[data-code="' + code + '"]');
    if (row) {
      row.classList.remove('just-updated');
      void row.offsetWidth;
      row.classList.add('just-updated');
    }
  }

  // ── Feedback: toast + vibrate + beep ──
  const AC = typeof AudioContext !== 'undefined' ? AudioContext :
             typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null;
  const audioCtx = AC ? new AC() : null;
  function beep(freq, dur) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = freq;
      o.connect(g);
      g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.2, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function showToast(text, kind) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.className = 'toast show ' + (kind || '');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.className = 'toast'; }, 1200);
  }
  function feedback(isNew, code) {
    if (navigator.vibrate) navigator.vibrate(isNew ? 50 : [30, 30, 30]);
    beep(isNew ? 880 : 1200, 0.12);
    const q = tally.get(code);
    showToast(code + (isNew ? '  (new)' : '  ×' + q), isNew ? 'success' : 'dup');
    if (tg?.HapticFeedback) {
      tg.HapticFeedback.notificationOccurred(isNew ? 'success' : 'warning');
    }
  }

  function addScan(code) {
    // Debounce: ignore same code within 800ms
    const now = Date.now();
    if (lastScan.code === code && now - lastScan.at < 800) return;
    lastScan = { code, at: now };

    const isNew = !tally.has(code);
    tally.set(code, (tally.get(code) || 0) + 1);
    render();
    flashRow(code);
    feedback(isNew, code);
  }

  // ── List interactions (event delegation) ──
  document.getElementById('list').addEventListener('click', e => {
    const row = e.target.closest('.row');
    if (!row) return;
    const code = row.dataset.code;
    const act = e.target.dataset.act;
    if (act === 'plus') {
      tally.set(code, (tally.get(code) || 0) + 1);
      render();
      flashRow(code);
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    } else if (act === 'minus') {
      const q = tally.get(code) - 1;
      if (q <= 0) tally.delete(code);
      else tally.set(code, q);
      render();
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    } else if (act === 'del') {
      if (confirm('Remove ' + code + '?')) {
        tally.delete(code);
        render();
      }
    } else if (act === 'edit') {
      openEditor(code);
    }
  });

  // ── Editor ──
  let editingCode = null;
  function openEditor(code) {
    editingCode = code;
    document.getElementById('editCode').textContent = code;
    document.getElementById('editInput').value = tally.get(code);
    document.getElementById('editOverlay').classList.add('show');
    setTimeout(() => document.getElementById('editInput').focus(), 100);
  }
  document.getElementById('editCancel').onclick = () => {
    document.getElementById('editOverlay').classList.remove('show');
  };
  document.getElementById('editSave').onclick = () => {
    const v = parseInt(document.getElementById('editInput').value, 10);
    if (isNaN(v) || v < 0) return;
    if (v === 0) tally.delete(editingCode);
    else tally.set(editingCode, v);
    render();
    document.getElementById('editOverlay').classList.remove('show');
  };

  // ── Clear ──
  document.getElementById('clearBtn').onclick = () => {
    if (tally.size === 0) return;
    if (confirm('Clear all ' + tally.size + ' scanned items?')) {
      tally.clear();
      render();
    }
  };

  // ── Submit ──
  document.getElementById('submitBtn').onclick = () => {
    if (tally.size === 0) return;
    const scans = [...tally.entries()].map(([code, qty]) => ({ code, qty }));
    const payload = { scans, scanned_at: new Date().toISOString() };
    if (tg?.sendData) {
      tg.sendData(JSON.stringify(payload));
      // tg.close() is called by Telegram automatically after sendData
    } else {
      // Fallback for testing in browser
      alert('Not in Telegram. Payload:\n' + JSON.stringify(payload, null, 2));
    }
  };

  // ── Scanner init ──
  const html5QrCode = new Html5Qrcode('reader', { verbose: false });
  const scanConfig = {
    fps: 10,
    qrbox: { width: 260, height: 100 },
    aspectRatio: 1,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  };

  function startScanner() {
    html5QrCode.start(
      { facingMode: 'environment' },
      scanConfig,
      (decoded) => addScan(String(decoded).trim()),
      () => { /* ignore per-frame errors */ }
    ).catch(err => {
      showToast('Camera error: ' + err, '');
      console.error(err);
    });
  }
  startScanner();

  render();
</script>

</body>
</html>
